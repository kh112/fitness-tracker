<!doctype html>

<head>

<link rel="manifest" href="manifest.webmanifest">

  <h1 class="topbar__title">Training</h1>

<main id="view" class="view" tabindex="-1"></main>

<nav class="tabbar" id="tabbar" hidden></nav>
